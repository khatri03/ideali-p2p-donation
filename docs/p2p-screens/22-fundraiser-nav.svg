<text x="945" y="676" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0f5a3d" font-weight="400" text-anchor="start">No second website.</text>
<text x="945" y="692" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0f5a3d" font-weight="400" text-anchor="start">No second password.</text>
<text x="945" y="708" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0f5a3d" font-weight="400" text-anchor="start">No change to anybody else&#x27;s menu.</text>
<text x="945" y="724" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0f5a3d" font-weight="400" text-anchor="start">No new kind of account — a switch</text>
