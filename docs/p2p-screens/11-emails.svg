<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-label="Automatic emails"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0b1c5c" flood-opacity="0.07"/></filter></defs><rect width="1280" height="880" fill="#dfe4ef"/><rect x="0" y="0" width="1280" height="880" rx="0" fill="#dfe4ef"/>
<rect x="20" y="20" width="1240" height="840" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#sh)"/>
<rect x="21" y="21" width="1238" height="46" rx="16" fill="#eef1f6"/>
<rect x="21" y="50" width="1238" height="17" rx="0" fill="#eef1f6"/>
<circle cx="48" cy="44" r="6" fill="#ff5f57"/>
<circle cx="68" cy="44" r="6" fill="#febc2e"/>
<circle cx="88" cy="44" r="6" fill="#28c840"/>
<rect x="120" y="32" width="1080" height="24" rx="12" fill="#ffffff" stroke="#dbe0ea" stroke-width="1"/>
<text x="134" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">🔒</text>
<text x="150" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Automatic emails — no staff time needed</text>
<line x1="21" y1="67" x2="1259" y2="67" stroke="#dbe0ea" stroke-width="1"/>
<rect x="21" y="68" width="1238" height="791" rx="0" fill="#f4f7fe"/>
<text x="64" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" fill="#0b1c5c" font-weight="800" text-anchor="start">Emails the system sends on its own</text>
<text x="64" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">Nobody at the charity writes these. They keep fundraisers moving.</text>
<rect x="64" y="190" width="360" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#sh)"/>
<rect x="65" y="191" width="358" height="62" rx="14" fill="#f7f9ff"/>
<rect x="65" y="235" width="358" height="18" rx="0" fill="#f7f9ff"/>
<circle cx="100.0" cy="222.0" r="16.0" fill="#1b4dff" opacity="0.12"/>
<text x="100.0" y="227.12" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.4" fill="#1b4dff" font-weight="700" text-anchor="middle">✉</text>
<text x="128" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#0b1c5c" font-weight="800" text-anchor="start">Somebody gave you £50</text>
<text x="128" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">To the fundraiser, within seconds</text>
<text x="88" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">Ahmed Khan just gave £50 to your page.</text>
<text x="88" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start"></text>
<text x="88" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">“Proud of you.”</text>
<text x="88" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start"></text>
<text x="88" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">You are now at £310 of £500.</text>
<text x="88" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1b4dff" font-weight="700" text-anchor="start">Say thanks ›</text>
<rect x="456" y="190" width="360" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#sh)"/>
<rect x="457" y="191" width="358" height="62" rx="14" fill="#f7f9ff"/>
<rect x="457" y="235" width="358" height="18" rx="0" fill="#f7f9ff"/>
<circle cx="492.0" cy="222.0" r="16.0" fill="#0f7b53" opacity="0.12"/>
<text x="492.0" y="227.12" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.4" fill="#0f7b53" font-weight="700" text-anchor="middle">★</text>
<text x="520" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#0b1c5c" font-weight="800" text-anchor="start">You are halfway there</text>
<text x="520" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">To the fundraiser, at 50% of goal</text>
<text x="480" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">Sara, you passed £250 — halfway to your</text>
<text x="480" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">target. 22 people have backed you.</text>
<text x="480" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start"></text>
<text x="480" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">Most pages that reach halfway finish.</text>
<text x="480" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1b4dff" font-weight="700" text-anchor="start">Share your page again ›</text>
<rect x="848" y="190" width="360" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#sh)"/>
<rect x="849" y="191" width="358" height="62" rx="14" fill="#f7f9ff"/>
<rect x="849" y="235" width="358" height="18" rx="0" fill="#f7f9ff"/>
<circle cx="884.0" cy="222.0" r="16.0" fill="#8a5a00" opacity="0.12"/>
<text x="884.0" y="227.12" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.4" fill="#8a5a00" font-weight="700" text-anchor="middle">⏰</text>
<text x="912" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#0b1c5c" font-weight="800" text-anchor="start">Your page has gone quiet</text>
<text x="912" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">To the fundraiser, after 7 quiet days</text>
<text x="872" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">No gifts on your page for a week.</text>
<text x="872" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start"></text>
<text x="872" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">One message to five people usually</text>
<text x="872" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3c4457" font-weight="400" text-anchor="start">restarts it. Here is your link.</text>
<text x="872" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1b4dff" font-weight="700" text-anchor="start">Copy my link ›</text>
<rect x="64" y="526" width="1152" height="150" rx="14" fill="#f7faff" stroke="#d7e2ff" stroke-width="1" filter="url(#sh)"/>
<text x="96" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#0b1c5c" font-weight="800" text-anchor="start">Why this matters</text>
<text x="96" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">•  A fundraiser who is thanked and nudged raises more than one who is left alone.</text>
<text x="96" y="624" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">•  Today a member of staff would have to watch 86 pages and email each person by hand.</text>
<text x="96" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">•  After this, the system does it. The charity only steps in when it wants to.</text></svg>